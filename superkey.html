      .wrap{max-width:420px;margin:0 auto;position:relative;z-index:1}
      .brand{
        text-align:center;margin-bottom:16px;
      }
      .brand .logo{
        display:inline-block;height:46px;width:auto;margin-bottom:10px;
        filter:drop-shadow(0 4px 10px rgba(120,120,60,.25));
      }
      h3{margin:0;font-size:21px;font-weight:600;letter-spacing:.5px;color:#3A4500}
      .brand .sub{margin-top:4px;font-size:12px;color:#96A355;letter-spacing:1px}
      .card{
        background:rgba(255,255,255,.92);border-radius:18px;
        padding:22px 18px;box-shadow:0 8px 28px rgba(140,165,0,.16);
        backdrop-filter:blur(6px);
      }
      .field{margin-bottom:16px}
      .field label{
        display:block;font-size:12px;font-weight:600;color:#8A9A3D;
        letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px;
      }
      input[type="text"]{
        width:100%;padding:13px 12px;font-size:17px;font-family:inherit;
        border:1.5px solid #E2E8BE;border-radius:12px;background:#FCFDF4;
        outline:none;transition:border-color .15s,background .15s,box-shadow .15s;
      }
      input[type="text"]::placeholder{color:#C2CA9A}
      input[type="text"]:focus{
        border-color:#C3D600;background:#fff;
        box-shadow:0 0 0 3px rgba(195,214,0,.18);
      }
      #token{
        font-size:26px;font-weight:700;text-align:center;letter-spacing:8px;
        color:#5F7000;background:#F7FAE4;border-style:dashed;
      }
      button,input[type="submit"]{
        -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
        font-size:16px;font-family:inherit;font-weight:600;border-radius:12px;
        padding:13px 16px;width:100%;letter-spacing:.5px;
        transition:transform .1s,opacity .15s;
      }
      button:active,input[type="submit"]:active{transform:scale(.97);opacity:.9}
      #showKey{
        background:#F1F6D8;color:#6B8000;margin-bottom:18px;font-size:14px;
        border:1px dashed #C9D67E;
      }
      #genToken{
        background:linear-gradient(145deg,#D3E23E,#B5CB00);
        color:#2A3500;font-size:17px;font-weight:700;
        box-shadow:0 6px 16px rgba(163,188,0,.35);
      }
      .note{color:#A9B37F;font-size:12px;margin-top:18px;text-align:center;letter-spacing:.5px}
      .divider{
        display:flex;align-items:center;gap:10px;margin:4px 0 16px;
        color:#B4BF87;font-size:11px;letter-spacing:2px;
      }
      .divider::before,.divider::after{content:"";flex:1;height:1px;background:#E6ECBE}
    </style>
  </head>
